<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Questions - {{ game.room_code }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/game.css') }}">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Setup Questions - Room: {{ game.room_code }}</h1>
            <div>
                <a href="{{ url_for('host_dashboard') }}" class="btn btn-secondary">Back to Dashboard</a>
                <a href="{{ url_for('host_game', room_code=game.room_code) }}" class="btn btn-primary">Start Game</a>
            </div>
        </div>
        
        <div class="setup-layout">
            <div class="questions-section">
                <h2>Questions</h2>
                <button id="addQuestionBtn" class="btn btn-primary">Add Question</button>
                <div id="questionsGrid" class="questions-grid">
                    {% for question in questions %}
                    <div class="question-card" data-question-id="{{ question.id }}" style="cursor: pointer;" title="Click to edit">
                        <div class="question-category">{{ question.category }}</div>
                        <div class="question-value">${{ question.value }}</div>
                        <div class="question-type-badge">{{ 'MC' if question.question_type == 'multiple_choice' else 'Type' }}</div>
                        <button class="delete-question-btn" data-question-id="{{ question.id }}" onclick="event.stopPropagation();">Delete</button>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
    
    <!-- Add/Edit Question Modal -->
    <div id="addQuestionModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Add Question</h2>
            <form id="addQuestionForm">
                <input type="hidden" id="editQuestionId" value="">
                <div class="form-group">
                    <label for="category">Category:</label>
                    <input type="text" id="category" name="category" required>
                </div>
                <div class="form-group">
                    <label for="value">Value ($):</label>
                    <input type="number" id="value" name="value" min="100" step="10" required>
                </div>
                <div class="form-group">
                    <label for="question_type">Question Type:</label>
                    <select id="question_type" name="question_type" required>
                        <option value="type_answer">Type Answer</option>
                        <option value="multiple_choice">Multiple Choice</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="question_text">Question:</label>
                    <textarea id="question_text" name="question_text" rows="3" required></textarea>
                </div>
                <div id="mcOptionsSection" style="display: none;">
                    <div class="form-group">
                        <label>Options (one per line, first one is correct):</label>
                        <textarea id="mcOptions" name="mcOptions" rows="4" placeholder="Option 1 (correct)&#10;Option 2&#10;Option 3&#10;Option 4"></textarea>
                    </div>
                </div>
                <div id="typeAnswerSection">
                    <div class="form-group">
                        <label for="answer">Answer:</label>
                        <input type="text" id="answer" name="answer" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="submitBtn">Add Question</button>
                <button type="button" class="btn btn-secondary" id="cancelEditBtn" style="display: none;">Cancel</button>
            </form>
        </div>
    </div>
    
    <script>
        const roomCode = '{{ game.room_code }}';
        const gameId = {{ game.id }};
    </script>
    <script src="{{ url_for('static', filename='js/host_setup.js') }}"></script>
</body>
</html>
